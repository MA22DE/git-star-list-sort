[project]
name = "git-star-list-sort"
version = "0.1.0"
description = "Classify GitHub stars into existing Lists with Jev"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
git-star-list-sort = "git_star_list_sort.cli:main"
git-star-list-sort-apply = "git_star_list_sort.apply:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"